name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://kathapp:kathapp@localhost:5432/kathapp?schema=public
  TEST_DATABASE_URL: postgresql://kathapp:kathapp@localhost:5432/kathapp?schema=test

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kathapp
          POSTGRES_PASSWORD: kathapp
          POSTGRES_DB: kathapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kathapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build -w @kathapp/shared

      - name: Generate Prisma client
        run: npm run prisma:generate -w @kathapp/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Integration tests run against the postgres service in a dedicated
      # schema. db.ts fails hard if TEST_DATABASE_URL is missing under CI, so
      # the suite cannot be skipped into a false green.
      - name: Test
        run: npm test

      - name: Build api + web
        run: npm run build -w @kathapp/api && npm run build -w @kathapp/web
